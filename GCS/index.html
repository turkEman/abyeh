<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC Telemetry</title>
</head>
<body>

  <div id="statusbar">
    <span id="dot">●</span> <span id="conn-text">Disconnected — retrying...</span>
    &nbsp;|&nbsp; pkts: <span id="pkt-count">0</span>
    &nbsp;|&nbsp; rate: <span id="rate">—</span> Hz
    &nbsp;|&nbsp; drops: <span id="drop-count">0</span>
  </div>

  <div id="layout">

    <div id="telem-panel">
      <h3>TELEMETRY</h3>
      <table border="1" cellpadding="4">
        <thead><tr><th>variable</th><th>value</th></tr></thead>
        <tbody id="telem-body"></tbody>
      </table>
    </div>

    <div id="ctrl-panel">
      <h3>CONTROL</h3>
      <div id="ctrl-groups"></div>
      <br>
      <button id="send-btn" disabled onclick="sendControl()">SEND ALL</button>
      <button id="req-btn"  disabled onclick="requestControlValues()">REQUEST VALUES</button>
      <div id="feedback"></div>
    </div>

  </div>

  <script src="controls-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
