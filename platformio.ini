[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed=2000000

build_flags =
    -std=gnu++17
    -I include
    -DCORE_DEBUG_LEVEL=0                ; Set to 5 for verbose ESP-IDF logs
    -DWB_DEBUG                          ; Enable WB debug
    ; -DWB_DEBUG_VERBOSE                ; Uncomment for per-packet debugging
    

monitor_rts = 0
monitor_dtr = 0

; ArduinoJson v6 (stable). v7 has a different API.
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
